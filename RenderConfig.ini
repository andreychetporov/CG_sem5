; Настройки применяются при запуске программы.
; 1 — включено, 0 — выключено.

[Rendering]
; Background only; IBL lighting remains active.
Skybox=0
Shadows=1
PCF=1
FrustumCulling=1
Octree=1
DebugMode=0

[Terrain]
; New terrain laboratory. Set Enabled=0 to return to Sponza.
Enabled=1
FrustumCulling=1
Wireframe=0
ColorLOD=0

[PostProcessing]
DepthOfField=0
EyeAdaptation=0
EyeAdaptationTest=0
MouseTrail=0

[Controls]
; При 0 остаются только управление камерой и мышь.
; При 1 возвращаются старые переключатели F1–F9 и 1–5.
RuntimeHotkeys=0
